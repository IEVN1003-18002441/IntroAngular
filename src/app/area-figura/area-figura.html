

<div class="col-6">
    <div class="mb-3">
        <form>
            <div class="form-group pt-4">
                <label for="num1">Número 1 / Base / Radio / Lado</label>
                <input [(ngModel)]="num1" type="text" name="num1" class="form-control" id="num1" placeholder="Ingresa el primer número">
            </div>
            
            <div class="form-group pt-4">
                <label for="num2">Número 2 / Altura / Apotema</label>
                <input [(ngModel)]="num2" type="text" name="num2" class="form-control" id="num2" placeholder="Ingresa el segundo número">
            </div>
            <br>

            <button (click)="opciones()" type="button" class="btn btn-primary" style="margin-bottom: 33px;" [disabled]="!op">Calcular</button>

            <div class="form-check">
                <input class="form-check-input" type="radio" value="cuadrado" id="radioCuadrado" name="figura" [(ngModel)]="op">
                <label class="form-check-label" for="radioCuadrado">Cuadrado</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" value="triangulo" id="radioTriangulo" name="figura" [(ngModel)]="op">
                <label class="form-check-label" for="radioTriangulo">Triángulo</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" value="circulo" id="radioCirculo" name="figura" [(ngModel)]="op">
                <label class="form-check-label" for="radioCirculo">Círculo</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" value="pentagono" id="radioPentagono" name="figura" [(ngModel)]="op">
                <label class="form-check-label" for="radioPentagono">Pentágono</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" value="rectangulo" id="radioRectangulo" name="figura" [(ngModel)]="op">
                <label class="form-check-label" for="radioRectangulo">Rectángulo</label>
            </div>
        </form>
    </div>
</div>

<div class="col-6">
    <h2>Resultado: {{resultado}}</h2>
</div>
