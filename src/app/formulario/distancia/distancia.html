<div class="container mt-4">
    <div class="row">
        <div class="col-6">
            <form>
                <div class="mb-3">
                    <label for="x1" class="form-label">X1</label>
                    <input
                        [(ngModel)]="x1"
                        type="number"
                        name="x1"
                        class="form-control"
                        id="x1"
                        placeholder="Ingresa X1">
                </div>
                <div class="mb-3">
                    <label for="y1" class="form-label">Y1</label>
                    <input
                        [(ngModel)]="y1"
                        type="number"
                        name="y1"
                        class="form-control"
                        id="y1"
                        placeholder="Ingresa Y1">
                </div>
                <div class="mb-3">
                    <label for="x2" class="form-label">X2</label>
                    <input
                        [(ngModel)]="x2"
                        type="number"
                        name="x2"
                        class="form-control"
                        id="x2"
                        placeholder="Ingresa X2">
                </div>
                <div class="mb-3">
                    <label for="y2" class="form-label">Y2</label>
                    <input
                        [(ngModel)]="y2"
                        type="number"
                        name="y2"
                        class="form-control"
                        id="y2"
                        placeholder="Ingresa Y2">
                </div>
                <button
                    (click)="calcular()"
                    type="button"
                    class="btn btn-primary">
                    Calcular
                </button>
            </form>
            <div class="mt-4">
                <h2>Resultado: {{resultado}}</h2>
            </div>
        </div>
    </div>
</div>
